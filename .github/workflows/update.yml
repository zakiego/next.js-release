name: Update Release Data

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-release-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      OCTOKIT_TOKEN: ${{ secrets.OCTOKIT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch releases
        run: bun run update-data

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain public/data.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new releases."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "Update release data"
          git push origin main
